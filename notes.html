<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>یادداشت‌ها | باتقویم</title><link rel="icon" href="assets/images/logo.png" type="image/png"><link rel="stylesheet" href="assets/css/app.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-logo"><img src="assets/images/logo.png" alt="لوگوی باتقویم"></span><span><b>باتقویم</b><small>بستر تقویم و رویداد</small></span></a><nav><a href="index.html">نخست</a><a href="about.html">معرفی</a><a href="contact.html">تماس</a><a href="events.html">رویدادها</a><a class="active" href="notes.html">یادداشت‌ها</a><a href="projects.html">پروژه‌ها</a><a href="tools.html">ابزارها</a><a href="login.html">ورود</a></nav></header>
<main><section class="section workspace-page notes-workspace"><div class="workspace-page-head"><div><span>دفتر شخصی</span><h1 class="page-title">یادداشت‌ها</h1></div><div class="workspace-head-actions"><button id="newNote" class="add-btn" type="button">＋ یادداشت جدید</button></div></div>
<div class="workspace-stats"><div><b id="notesCount">۰</b><span>یادداشت</span></div><div><b id="pinnedCount">۰</b><span>سنجاق‌شده</span></div><div><b id="tagCount">۰</b><span>دسته</span></div></div>
<div class="notes-toolbar"><input id="noteSearch" type="search" placeholder="جست‌وجوی یادداشت..."><select id="noteFilter"><option value="all">همه دسته‌ها</option><option>شخصی</option><option>کار</option><option>ایده</option><option>پروژه</option><option>مطالعه</option></select><label><input id="pinnedOnly" type="checkbox"> فقط سنجاق‌شده</label></div>
<div class="notes-layout"><aside class="notes-list" id="notesList"></aside><article class="note-editor"><div class="note-editor-top"><button id="pinNote" class="outline" type="button">☆ سنجاق</button><span id="noteDate"></span></div><input id="noteTitle" class="note-title-input" placeholder="عنوان یادداشت"><textarea id="noteBody" placeholder="یادداشت خود را بنویسید..."></textarea><div class="note-actions"><select id="noteTag"><option>شخصی</option><option>کار</option><option>ایده</option><option>پروژه</option><option>مطالعه</option></select><button id="saveNote" class="add-btn" type="button">ذخیره یادداشت</button><button id="deleteNote" class="outline" type="button">حذف</button></div></article></div></section></main><footer><span>دفترچه یادداشت</span><a href="index.html">بازگشت به باتقویم</a></footer>
<script>
(()=>{"use strict";const $=s=>document.querySelector(s),fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);let notes=JSON.parse(localStorage.getItem("bataqvim-notes")||"[]"),active=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){localStorage.setItem("bataqvim-notes",JSON.stringify(notes));render()}
function render(){const q=$("#noteSearch").value.trim().toLowerCase(),tag=$("#noteFilter").value,pin=$("#pinnedOnly").checked,view=notes.filter(n=>(!q||((n.title+" "+n.body).toLowerCase().includes(q)))&&(tag==="all"||n.tag===tag)&&(!pin||n.pinned));$("#notesCount").textContent=fa(notes.length);$("#pinnedCount").textContent=fa(notes.filter(n=>n.pinned).length);$("#tagCount").textContent=fa(new Set(notes.map(n=>n.tag)).size);$("#notesList").innerHTML=view.length?view.map(n=>'<button class="note-row '+(n.id===active?"active":"")+'" data-id="'+n.id+'"><span class="note-pin">'+(n.pinned?"★":"")+'</span><b>'+esc(n.title||"بدون عنوان")+'</b><small>'+esc(n.tag||"شخصی")+' · '+new Date(n.updatedAt).toLocaleDateString("fa-IR")+'</small></button>').join(""):'<div class="notes-empty">یادداشتی پیدا نشد.</div>';$("#notesList").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id))}
function open(id){active=id;const n=notes.find(x=>x.id===id);$("#noteTitle").value=n?.title||"";$("#noteBody").value=n?.body||"";$("#noteTag").value=n?.tag||"شخصی";$("#noteDate").textContent=n?"آخرین ویرایش "+new Date(n.updatedAt).toLocaleString("fa-IR"):"یادداشت تازه";$("#pinNote").textContent=n?.pinned?"★ سنجاق‌شده":"☆ سنجاق";render()}
function fresh(){$("#noteTitle").value="";$("#noteBody").value="";$("#noteTag").value="شخصی";$("#noteDate").textContent="یادداشت تازه";active=null;$("#pinNote").textContent="☆ سنجاق";render()}
$("#newNote").onclick=fresh;$("#noteSearch").oninput=render;$("#noteFilter").onchange=render;$("#pinnedOnly").onchange=render;$("#pinNote").onclick=()=>{if(!active)return;const n=notes.find(x=>x.id===active);n.pinned=!n.pinned;n.updatedAt=new Date().toISOString();persist();open(active)};
$("#saveNote").onclick=()=>{const title=$("#noteTitle").value.trim(),body=$("#noteBody").value.trim();if(!title&&!body)return;const id=active||Date.now().toString(36),old=notes.find(n=>n.id===id),item={id,title,body,tag:$("#noteTag").value,pinned:old?.pinned||false,updatedAt:new Date().toISOString()};const i=notes.findIndex(n=>n.id===id);if(i<0)notes.unshift(item);else notes[i]=item;active=id;persist();open(id)};
$("#deleteNote").onclick=()=>{if(!active)return;notes=notes.filter(n=>n.id!==active);persist();fresh()};render();if(notes[0])open(notes[0].id);})();
</script><script src="assets/js/site.js?v=20261002-3"></script></body></html>
