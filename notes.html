<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>یادداشت‌ها | تقویم</title><link rel="icon" href="assets/images/logo.png" type="image/png"><link rel="stylesheet" href="assets/css/app.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-logo"><img src="assets/images/logo.png" alt="لوگوی تقویم"></span><span><b>تقویم</b><small>بستر تقویم و رویداد</small></span></a><nav><a href="index.html">نخست</a><a href="about.html">معرفی</a><a href="contact.html">تماس</a><a href="events.html">رویدادها</a><a class="active" href="notes.html">یادداشت‌ها</a><a href="projects.html">پروژه‌ها</a><a href="tools.html">ابزارها</a><a href="login.html">ورود</a></nav></header>
<main><section class="section workspace-page"><div class="workspace-page-head"><div><span>دفترچه شخصی</span><h1 class="page-title">یادداشت‌ها</h1></div><button id="newNote" class="add-btn" type="button">＋ یادداشت جدید</button></div><div class="notes-layout"><aside class="notes-list" id="notesList"></aside><article class="note-editor"><input id="noteTitle" class="note-title-input" placeholder="عنوان یادداشت"><textarea id="noteBody" placeholder="یادداشت خود را بنویسید..."></textarea><div class="note-actions"><select id="noteTag"><option>شخصی</option><option>کار</option><option>ایده</option><option>پروژه</option><option>مطالعه</option></select><button id="saveNote" class="add-btn" type="button">ذخیره یادداشت</button><button id="deleteNote" class="outline" type="button">حذف</button></div></article></div></section></main><footer><span>دفترچه یادداشت</span><a href="index.html">بازگشت به تقویم</a></footer>
<script>
(()=>{const $=s=>document.querySelector(s),fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);let notes=JSON.parse(localStorage.getItem("bataqvim-notes")||"[]"),active=null;
function save(){localStorage.setItem("bataqvim-notes",JSON.stringify(notes));renderList()}function renderList(){const box=$("#notesList");box.innerHTML=notes.length?notes.map(n=>'<button class="note-row '+(n.id===active?"active":"")+'" data-id="'+n.id+'"><b>'+esc(n.title||"بدون عنوان")+'</b><small>'+esc(n.tag||"شخصی")+' · '+new Date(n.updatedAt).toLocaleDateString("fa-IR")+'</small></button>').join(""):'<div class="notes-empty">دفترچه شما خالی است.</div>';box.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function open(id){active=id;const n=notes.find(x=>x.id===id);$("#noteTitle").value=n?.title||"";$("#noteBody").value=n?.body||"";$("#noteTag").value=n?.tag||"شخصی";renderList()}function fresh(){$("#noteTitle").value="";$("#noteBody").value="";$("#noteTag").value="شخصی";active=null;renderList()}$("#newNote").onclick=fresh;$("#saveNote").onclick=()=>{const item={id:active||Date.now().toString(36),title:$("#noteTitle").value.trim(),body:$("#noteBody").value,tag:$("#noteTag").value,updatedAt:new Date().toISOString()};if(!item.title&&!item.body)return;const i=notes.findIndex(n=>n.id===item.id);if(i<0)notes.unshift(item);else notes[i]=item;active=item.id;save();open(active)};$("#deleteNote").onclick=()=>{if(!active)return;notes=notes.filter(n=>n.id!==active);save();fresh()};renderList();if(notes[0])open(notes[0].id)})();
</script><script src="assets/js/site.js?v=20261002-2"></script></body></html>
