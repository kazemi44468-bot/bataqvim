<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروژه‌ها | تقویم</title><link rel="icon" href="assets/images/logo.png" type="image/png"><link rel="stylesheet" href="assets/css/app.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-logo"><img src="assets/images/logo.png" alt="لوگوی باتقویم"></span><span><b>باتقویم</b><small>بستر تقویم و رویداد</small></span></a><nav><a href="index.html">نخست</a><a href="about.html">معرفی</a><a href="contact.html">تماس</a><a href="events.html">رویدادها</a><a href="notes.html">یادداشت‌ها</a><a class="active" href="projects.html">پروژه‌ها</a><a href="tools.html">ابزارها</a><a href="login.html">ورود</a></nav></header>
<main><section class="section workspace-page"><div class="workspace-page-head"><div><span>برنامه‌ریزی</span><h1 class="page-title">مدیریت پروژه</h1></div><button id="newProject" class="add-btn" type="button">＋ پروژه جدید</button></div><div class="project-manager"><aside class="project-list-manager" id="projectList"></aside><article class="project-editor"><div class="project-editor-grid"><label>نام پروژه<input id="pTitle" placeholder="مثلاً راه‌اندازی محصول جدید"></label><label>موضوع پروژه<input id="pTopic" placeholder="موضوع یا حوزه پروژه"></label><label>شروع<input id="pStart" inputmode="numeric" placeholder="۱۴۰۵/۰۷/۱۰"></label><label>پایان<input id="pEnd" inputmode="numeric" placeholder="۱۴۰۵/۱۰/۳۰"></label><label>وضعیت<select id="pStatus"><option>برنامه‌ریزی</option><option>در حال اجرا</option><option>متوقف</option><option>تکمیل‌شده</option></select></label><label>اولویت<select id="pPriority"><option>عادی</option><option>مهم</option><option>فوری</option></select></label><label class="full">شرح پروژه<textarea id="pDesc" rows="4" placeholder="هدف، دامنه و توضیحات پروژه"></textarea></label></div><div class="project-actions"><button id="saveProject" class="add-btn" type="button">ذخیره پروژه</button><button id="deleteProject" class="outline" type="button">حذف</button><button id="addMilestone" class="outline" type="button">＋ افزودن نقطه عطف به تقویم</button></div><div id="projectMeta" class="project-meta"></div></article></div></section></main><footer><span>مدیریت پروژه و زمان‌بندی</span><a href="index.html">بازگشت به تقویم</a></footer>
<script>
(()=>{const $=s=>document.querySelector(s);let ps=JSON.parse(localStorage.getItem("bataqvim-projects")||"[]"),active=null;const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);function save(){localStorage.setItem("bataqvim-projects",JSON.stringify(ps));renderList()}function renderList(){const b=$("#projectList");b.innerHTML=ps.length?ps.map(p=>'<button class="project-row '+(p.id===active?"active":"")+'" data-id="'+p.id+'"><b>'+esc(p.title||"بدون عنوان")+'</b><small>'+esc(p.topic||"پروژه")+' · '+esc(p.status||"برنامه‌ریزی")+'</small></button>').join(""):'<div class="notes-empty">هنوز پروژه‌ای ایجاد نشده است.</div>';b.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>open(x.dataset.id))}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function open(id){active=id;const p=ps.find(x=>x.id===id);$("#pTitle").value=p?.title||"";$("#pTopic").value=p?.topic||"";$("#pStart").value=p?.start||"";$("#pEnd").value=p?.end||"";$("#pStatus").value=p?.status||"برنامه‌ریزی";$("#pPriority").value=p?.priority||"عادی";$("#pDesc").value=p?.desc||"";$("#projectMeta").innerHTML=p?'<span>آخرین ویرایش: '+new Date(p.updatedAt).toLocaleDateString("fa-IR")+'</span>':"";renderList()}function fresh(){active=null;["pTitle","pTopic","pStart","pEnd","pDesc"].forEach(id=>$("#"+id).value="");$("#pStatus").value="برنامه‌ریزی";$("#pPriority").value="عادی";$("#projectMeta").innerHTML="";renderList()}$("#newProject").onclick=fresh;$("#saveProject").onclick=()=>{const p={id:active||Date.now().toString(36),title:$("#pTitle").value.trim(),topic:$("#pTopic").value.trim(),start:$("#pStart").value.trim(),end:$("#pEnd").value.trim(),status:$("#pStatus").value,priority:$("#pPriority").value,desc:$("#pDesc").value,updatedAt:new Date().toISOString()};if(!p.title)return;const i=ps.findIndex(x=>x.id===p.id);if(i<0)ps.unshift(p);else ps[i]=p;active=p.id;save();open(active)};$("#deleteProject").onclick=()=>{if(!active)return;ps=ps.filter(p=>p.id!==active);save();fresh()};$("#addMilestone").onclick=()=>{if(!active){alert("ابتدا یک پروژه را ذخیره کنید.");return}const p=ps.find(x=>x.id===active),d=prompt("تاریخ نقطه عطف را وارد کنید:",p.start||"۱۴۰۵/۰۷/۱۰"),t=prompt("عنوان نقطه عطف:","نقطه عطف پروژه");if(!d||!t)return;let ev=JSON.parse(localStorage.getItem("bataqvim-events")||"[]");ev.push({id:"project-"+Date.now().toString(36),date:d.replace(/[۰-۹]/g,x=>"۰۱۲۳۴۵۶۷۸۹".indexOf(x)),title:t,type:"project",projectId:p.id,note:"نقطه عطف پروژه "+p.title});localStorage.setItem("bataqvim-events",JSON.stringify(ev));alert("نقطه عطف به تقویم اضافه شد.")};renderList();if(ps[0])open(ps[0].id)})();
</script><script src="assets/js/site.js?v=20261002-2"></script></body></html>
