<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروژه‌ها | باتقویم</title><link rel="icon" href="assets/images/logo.png" type="image/png"><link rel="stylesheet" href="assets/css/app.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-logo"><img src="assets/images/logo.png" alt="لوگوی باتقویم"></span><span><b>باتقویم</b><small>بستر تقویم و رویداد</small></span></a><nav><a href="index.html">نخست</a><a href="about.html">معرفی</a><a href="contact.html">تماس</a><a href="events.html">رویدادها</a><a href="notes.html">یادداشت‌ها</a><a class="active" href="projects.html">پروژه‌ها</a><a href="tools.html">ابزارها</a><a href="login.html">ورود</a></nav></header>
<main><section class="section workspace-page project-workspace"><div class="workspace-page-head"><div><span>مدیریت زمان</span><h1 class="page-title">پروژه‌ها</h1></div><button id="newProject" class="add-btn" type="button">＋ پروژه جدید</button></div>
<div class="workspace-stats"><div><b id="projectsCount">۰</b><span>پروژه</span></div><div><b id="activeCount">۰</b><span>در حال اجرا</span></div><div><b id="doneCount">۰</b><span>تکمیل‌شده</span></div><div><b id="milestoneCount">۰</b><span>نقطه عطف</span></div></div>
<div class="project-manager"><aside class="project-list-manager"><div class="project-list-tools"><input id="projectSearch" type="search" placeholder="جست‌وجوی پروژه..."><select id="projectFilter"><option value="all">همه وضعیت‌ها</option><option>برنامه‌ریزی</option><option>در حال اجرا</option><option>متوقف</option><option>تکمیل‌شده</option></select></div><div id="projectList"></div></aside>
<article class="project-editor"><div class="project-editor-top"><span id="projectMeta">پروژه تازه</span><div class="project-progress"><i id="progressFill"></i></div></div>
<div class="project-editor-grid"><label>نام پروژه<input id="pTitle" placeholder="نام پروژه"></label><label>موضوع<input id="pTopic" placeholder="موضوع یا حوزه پروژه"></label><label>شروع<input id="pStart" inputmode="numeric" placeholder="۱۴۰۵/۰۷/۱۰"></label><label>پایان<input id="pEnd" inputmode="numeric" placeholder="۱۴۰۵/۱۰/۳۰"></label><label>وضعیت<select id="pStatus"><option>برنامه‌ریزی</option><option>در حال اجرا</option><option>متوقف</option><option>تکمیل‌شده</option></select></label><label>اولویت<select id="pPriority"><option>عادی</option><option>مهم</option><option>فوری</option></select></label><label>درصد پیشرفت<input id="pProgress" type="number" min="0" max="100" value="0"></label><label>مسئول پروژه<input id="pOwner" placeholder="نام یا واحد مسئول"></label><label class="full">شرح پروژه<textarea id="pDesc" rows="4" placeholder="هدف، دامنه و توضیحات پروژه"></textarea></label></div>
<div class="milestone-box"><div class="subhead"><b>نقاط عطف</b><button id="addMilestone" class="outline" type="button">＋ افزودن</button></div><div id="milestoneList"></div></div>
<div class="project-actions"><button id="saveProject" class="add-btn" type="button">ذخیره پروژه</button><button id="deleteProject" class="outline" type="button">حذف</button></div></article></div></section></main><footer><span>مدیریت پروژه و زمان‌بندی</span><a href="index.html">بازگشت به باتقویم</a></footer>
<script>
(()=>{"use strict";const $=s=>document.querySelector(s),fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]),en=s=>String(s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));let ps=JSON.parse(localStorage.getItem("bataqvim-projects")||"[]"),active=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){localStorage.setItem("bataqvim-projects",JSON.stringify(ps));renderList();stats()}
function stats(){$("#projectsCount").textContent=fa(ps.length);$("#activeCount").textContent=fa(ps.filter(p=>p.status==="در حال اجرا").length);$("#doneCount").textContent=fa(ps.filter(p=>p.status==="تکمیل‌شده").length);$("#milestoneCount").textContent=fa(ps.reduce((a,p)=>a+(p.milestones?.length||0),0))}
function renderList(){const q=$("#projectSearch").value.trim().toLowerCase(),f=$("#projectFilter").value,view=ps.filter(p=>(!q||(p.title+" "+p.topic).toLowerCase().includes(q))&&(f==="all"||p.status===f));$("#projectList").innerHTML=view.length?view.map(p=>'<button class="project-row '+(p.id===active?"active":"")+'" data-id="'+p.id+'"><b>'+esc(p.title||"بدون عنوان")+'</b><small>'+esc(p.status||"برنامه‌ریزی")+' · '+fa(p.progress||0)+'٪</small><span class="mini-progress"><i style="width:'+Math.min(100,Math.max(0,p.progress||0))+'%"></i></span></button>').join(""):'<div class="notes-empty">پروژه‌ای پیدا نشد.</div>';$("#projectList").querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>open(x.dataset.id))}
function open(id){active=id;const p=ps.find(x=>x.id===id);$("#pTitle").value=p?.title||"";$("#pTopic").value=p?.topic||"";$("#pStart").value=p?.start||"";$("#pEnd").value=p?.end||"";$("#pStatus").value=p?.status||"برنامه‌ریزی";$("#pPriority").value=p?.priority||"عادی";$("#pProgress").value=p?.progress||0;$("#pOwner").value=p?.owner||"";$("#pDesc").value=p?.desc||"";$("#projectMeta").textContent=p?"آخرین ویرایش "+new Date(p.updatedAt).toLocaleString("fa-IR"):"پروژه تازه";$("#progressFill").style.width=(p?.progress||0)+"%";renderMilestones(p?.milestones||[]);renderList()}
function fresh(){active=null;["pTitle","pTopic","pStart","pEnd","pOwner","pDesc"].forEach(id=>$("#"+id).value="");$("#pStatus").value="برنامه‌ریزی";$("#pPriority").value="عادی";$("#pProgress").value=0;$("#projectMeta").textContent="پروژه تازه";$("#progressFill").style.width="0%";renderMilestones([]);renderList()}
function renderMilestones(ms){$("#milestoneList").innerHTML=ms.length?ms.map((m,i)=>'<div class="milestone-row"><div><b>'+esc(m.title)+'</b><small>'+esc(m.date||"بدون تاریخ")+'</small></div><button type="button" data-mi="'+i+'">حذف</button></div>').join(""):'<div class="milestone-empty">هنوز نقطه‌عطفی ثبت نشده است.</div>';$("#milestoneList").querySelectorAll("[data-mi]").forEach(b=>b.onclick=()=>{const p=ps.find(x=>x.id===active);if(!p)return;p.milestones.splice(+b.dataset.mi,1);persist();open(active)})}
$("#newProject").onclick=fresh;$("#projectSearch").oninput=renderList;$("#projectFilter").onchange=renderList;$("#pProgress").oninput=()=>$("#progressFill").style.width=Math.min(100,Math.max(0,+$("#pProgress").value||0))+"%";
$("#saveProject").onclick=()=>{const p={id:active||Date.now().toString(36),title:$("#pTitle").value.trim(),topic:$("#pTopic").value.trim(),start:$("#pStart").value.trim(),end:$("#pEnd").value.trim(),status:$("#pStatus").value,priority:$("#pPriority").value,progress:Math.min(100,Math.max(0,+$("#pProgress").value||0)),owner:$("#pOwner").value.trim(),desc:$("#pDesc").value,milestones:active?(ps.find(x=>x.id===active)?.milestones||[]):[],updatedAt:new Date().toISOString()};if(!p.title)return;const i=ps.findIndex(x=>x.id===p.id);if(i<0)ps.unshift(p);else ps[i]=p;active=p.id;persist();open(active)};
$("#deleteProject").onclick=()=>{if(!active)return;ps=ps.filter(p=>p.id!==active);persist();fresh()};
$("#addMilestone").onclick=()=>{if(!active){alert("ابتدا پروژه را ذخیره کنید.");return}const title=prompt("عنوان نقطه عطف:"),date=prompt("تاریخ نقطه عطف:",ps.find(x=>x.id===active)?.start||"۱۴۰۵/۰۷/۱۰");if(!title||!date)return;const p=ps.find(x=>x.id===active);p.milestones=p.milestones||[];p.milestones.push({title,date});let ev=JSON.parse(localStorage.getItem("bataqvim-events")||"[]");ev.push({id:"project-"+Date.now().toString(36),date:en(date),title,type:"project",projectId:p.id,note:"نقطه عطف پروژه "+p.title});localStorage.setItem("bataqvim-events",JSON.stringify(ev));p.updatedAt=new Date().toISOString();persist();open(active)};
stats();renderList();if(ps[0])open(ps[0].id);})();
</script><script src="assets/js/site.js?v=20261002-3"></script></body></html>
