<!-- موتور تقویم پایه: ماه/هفته/سال -->
<script>
/* =========================================================
   تقویم شمسی پایه — بدون وابستگی به کتابخانه خارجی
   ========================================================= */
(function () {
  "use strict";

  const FA_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",
                     "مهر","آبان","آذر","دی","بهمن","اسفند"];
  const FA_WEEKDAYS = ["شنبه","یک‌شنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنج‌شنبه","جمعه"];

  /* --- تبدیل میلادی <-> شمسی (الگوریتم استاندارد) --- */
  function div(a,b){return Math.floor(a/b)}
  function g2j(gy,gm,gd){
    const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
    let jy = (gy<=1600)?0:979;
    gy -= (gy<=1600)?621:1600;
    const gy2 = (gm>2)?(gy+1):gy;
    let days = (365*gy) + div(gy2+3,4) - div(gy2+99,100) + div(gy2+399,400)
             - 80 + gd + g_d_m[gm-1];
    jy += 33*div(days,12053); days %= 12053;
    jy += 4*div(days,1461);  days %= 1461;
    if(days>365){ jy += div(days-1,365); days = (days-1)%365; }
    const jm = (days<186)? 1+div(days,31) : 7+div(days-186,30);
    const jd = 1 + ((days<186)? days%31 : (days-186)%30);
    return [jy,jm,jd];
  }
  function j2g(jy,jm,jd){
    let gy = (jy<=979)?621:1600;
    jy -= (jy<=979)?0:979;
    let days = (365*jy) + (div(jy,33)*8) + div((jy%33)+3,4) + 78 + jd
             + ((jm<7)? (jm-1)*31 : (jm-7)*30 + 186);
    gy += 400*div(days,146097); days %= 146097;
    if(days>36524){ gy += 100*div(--days,36524); days %= 36524;
      if(days>=365) days++; }
    gy += 4*div(days,1461); days %= 1461;
    if(days>365){ gy += div(days-1,365); days = (days-1)%365; }
    let gd = days+1;
    const sal_a=[0,31,(gy%4===0 && gy%100!==0)||(gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31];
    let gm=1;
    for(; gm<=12 && gd>sal_a[gm]; gm++) gd -= sal_a[gm];
    return [gy,gm,gd];
  }

  /* --- وضعیت تقویم --- */
  const state = {
    view: "month",              // month | week | year
    today: null,                // [jy,jm,jd]
    cursor: { jy: 0, jm: 1 },   // ماه/سال در حال نمایش
    selected: null,             // روز انتخاب‌شده
    events: {}                  // { "1405/07/10": [ {title,type,time} ] }
  };

  function fa(n){ return String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]); }
  function pad(n){ return n<10? "0"+n : ""+n; }
  function keyOf(jy,jm,jd){ return `${jy}/${pad(jm)}/${pad(jd)}`; }

  /* --- امروز --- */
  function computeToday(){
    const now = new Date();
    return g2j(now.getFullYear(), now.getMonth()+1, now.getDate());
  }

  /* --- تعداد روزهای ماه شمسی --- */
  function daysInJMonth(jy,jm){
    if (jm <= 6) return 31;
    if (jm <= 11) return 30;
    const a = j2g(jy,12,1);
    const b = j2g(jy+1,1,1);
    const da = Date.UTC(a[0],a[1]-1,a[2]);
    const db = Date.UTC(b[0],b[1]-1,b[2]);
    return Math.round((db-da)/86400000);
  }

  /* --- روز هفته ستون (۰=شنبه) --- */
  function weekdayIndex(jy,jm,jd){
    const [gy,gm,gd] = j2g(jy,jm,jd);
    // JS: 0=Sunday ... 6=Saturday  → تبدیل به شنبه=0
    const wd = new Date(gy, gm-1, gd).getDay(); // 0..6
    return (wd + 1) % 7;
  }

  /* --- رندر --- */
  function renderView(view){
    state.view = view || state.view;
    document.querySelectorAll(".views .view").forEach(b=>{
      const active=b.dataset.view === state.view;
      b.classList.toggle("active", active);
      b.setAttribute("aria-selected", String(active));
    });
    const box = document.getElementById("calendarView");
    if (state.view === "month") box.innerHTML = renderMonth();
    else if (state.view === "week") box.innerHTML = renderWeek();
    else box.innerHTML = renderYear();

    // عنوان
    const title = document.getElementById("monthPicker");
    if (state.view === "year"){
      title.textContent = `${FA_MONTHS[0]} تا ${FA_MONTHS[11]} ${fa(state.cursor.jy)}`;
    } else if (state.view === "week"){
      const start = weekStart(state.today || state.selected);
      const end   = addDays(start, 6);
      title.textContent = `${fa(start[2])} ${FA_MONTHS[start[1]-1]} تا ${fa(end[2])} ${FA_MONTHS[end[1]-1]} ${fa(start[0])}`;
    } else {
      title.textContent = `${FA_MONTHS[state.cursor.jm-1]} ${fa(state.cursor.jy)}`;
    }

    // مارک گوشه
    const t = state.today || computeToday();
    document.getElementById("calMark").textContent = fa(t[2]);

    // اتصال کلیک سلول‌ها
    box.querySelectorAll("[data-day]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const [jy,jm,jd] = el.dataset.day.split("/").map(Number);
        selectDay(jy,jm,jd);
      });
    });

    syncSelectors();
    renderSelectedDay();
  }

  function syncSelectors(){
    const y=document.getElementById("yearSelect");
    const m=document.getElementById("monthSelect");
    const d=document.getElementById("daySelect");
    if(!y||!m||!d)return;
    y.value=state.cursor.jy;
    m.value=state.cursor.jm;
    const total=daysInJMonth(state.cursor.jy,state.cursor.jm);
    d.innerHTML="";
    for(let i=1;i<=total;i++){
      const o=document.createElement("option");
      o.value=i;o.textContent=fa(i);d.appendChild(o);
    }
    const selected=state.selected||state.today||computeToday();
    d.value=selected[0]===state.cursor.jy&&selected[1]===state.cursor.jm?selected[2]:Math.min(selected[2],total);
  }

  /* --- ماه --- */
  function renderMonth(){
    const {jy,jm} = state.cursor;
    const total = daysInJMonth(jy,jm);
    const startCol = weekdayIndex(jy,jm,1);
    const t = state.today || computeToday();
    let html = `<div class="month-weekdays">${FA_WEEKDAYS.map(d=>`<span>${d}</span>`).join("")}</div>`;
    html += `<div class="month-grid">`;
    for (let i=0;i<startCol;i++) html += `<div class="month-cell pad"></div>`;
    for (let d=1; d<=total; d++){
      const k = keyOf(jy,jm,d);
      const evs = state.events[k] || [];
      const isToday = (t[0]===jy && t[1]===jm && t[2]===d);
      html += `<div class="month-cell ${isToday?'is-today':''} ${evs.length?'has-event':''}" data-day="${k}">
        <span class="d">${fa(d)}</span>
        ${evs.slice(0,2).map(e=>`<span class="ev">${e.title}</span>`).join("")}
        ${evs.length>2?`<span class="ev">+${fa(evs.length-2)}</span>`:""}
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  /* --- هفته --- */
  function weekStart(d){
    const idx = weekdayIndex(d[0],d[1],d[2]);
    return addDays(d, -idx);
  }
  function addDays(d, n){
    let [jy,jm,jd] = d;
    const step = n>=0 ? 1 : -1;
    for (let i=0;i<Math.abs(n);i++){
      jd += step;
      if (jd < 1){ jm--; if (jm<1){jm=12; jy--;} jd = daysInJMonth(jy,jm); }
      else if (jd > daysInJMonth(jy,jm)){ jd=1; jm++; if (jm>12){jm=1; jy++;} }
    }
    return [jy,jm,jd];
  }
  function renderWeek(){
    const base = state.selected || state.today || computeToday();
    const start = weekStart(base);
    const t = state.today || computeToday();
    let html = `<div class="week-grid">`;
    for (let i=0;i<7;i++){
      const d = addDays(start, i);
      const k = keyOf(d[0],d[1],d[2]);
      const evs = state.events[k] || [];
      const isToday = (t[0]===d[0] && t[1]===d[1] && t[2]===d[2]);
      html += `<div class="week-day ${isToday?'is-today':''}" data-day="${k}">
        <div class="wd">${FA_WEEKDAYS[weekdayIndex(d[0],d[1],d[2])]}</div>
        <div class="wn">${fa(d[2])} <small style="font-size:9px;color:#8a9692">${FA_MONTHS[d[1]-1]}</small></div>
        ${evs.map(e=>`<div class="ev">${e.time?fa(e.time)+' · ':''}${e.title}</div>`).join("")}
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  /* --- سال --- */
  function renderYear(){
    const jy = state.cursor.jy;
    const t = state.today || computeToday();
    let html = `<div class="year-grid">`;
    for (let m=1;m<=12;m++){
      const total = daysInJMonth(jy,m);
      const startCol = weekdayIndex(jy,m,1);
      html += `<div class="year-month">
        <header><h3>${FA_MONTHS[m-1]}</h3><small>${fa(jy)}</small></header>
        <div class="mini-weekdays">${["ش","ی","د","س","چ","پ","ج"].map(d=>`<span>${d}</span>`).join("")}</div>
        <div class="mini-days">`;
      for (let i=0;i<startCol;i++) html += `<span class="pad"></span>`;
      for (let d=1; d<=total; d++){
        const k = keyOf(jy,m,d);
        const evs = state.events[k] || [];
        const isToday = (t[0]===jy && t[1]===m && t[2]===d);
        html += `<button data-day="${k}" class="${isToday?'is-today':''} ${evs.length?'has-event':''}">${fa(d)}</button>`;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
    return html;
  }

  /* --- انتخاب روز --- */
  function selectDay(jy,jm,jd){
    state.selected = [jy,jm,jd];
    if (state.view === "month"){ state.cursor = {jy,jm}; }
    if (state.view === "year"){ state.cursor.jy = jy; }
    renderView();
  }

  function renderSelectedDay(){
    const d = state.selected || state.today || computeToday();
    document.getElementById("selectedTitle").textContent =
      `${FA_WEEKDAYS[weekdayIndex(d[0],d[1],d[2])]} ${fa(d[2])} ${FA_MONTHS[d[1]-1]} ${fa(d[0])}`;
    const k = keyOf(d[0],d[1],d[2]);
    const evs = state.events[k] || [];
    const box = document.getElementById("dayEvents");
    if (!evs.length){
      box.innerHTML = `<div class="empty">برای این روز رویدادی ثبت نشده است.</div>`;
      return;
    }
    box.innerHTML = evs.map((e,i)=>`
      <div class="event-item ${e.type==='public'||e.type==='national'?'official-event':''}">
        <button type="button" data-del="${i}" aria-label="حذف">×</button>
        <b>${e.title}</b>
        <small>${e.time?fa(e.time)+' · ':''}${typeLabel(e.type)}</small>
      </div>`).join("");
    box.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click",()=>{
        const i = +b.dataset.del;
        evs.splice(i,1);
        renderView();
      });
    });
  }

  function typeLabel(t){
    return {personal:"شخصی",public:"عمومی",project:"پروژه",
            national:"ملی",religious:"مذهبی",iranian:"ایرانی",
            international:"بین‌المللی",special:"ویژه"}[t] || t;
  }

  /* --- هدر امروز --- */
  function renderTodayHeader(){
    const t = state.today = computeToday();
    const [gy,gm,gd] = j2g(t[0],t[1],t[2]);
    document.getElementById("todayJalali").textContent =
      `${fa(t[2])} ${FA_MONTHS[t[1]-1]} ${fa(t[0])}`;
    document.getElementById("todayWeekday").textContent =
      FA_WEEKDAYS[weekdayIndex(t[0],t[1],t[2])];
    document.getElementById("todayJalaliYear").textContent = fa(t[0]);
    document.getElementById("todayGregorian").textContent =
      `${gd} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][gm-1]} ${gy}`;
    document.getElementById("todayGregorianYear").textContent = fa(gy);
    document.getElementById("todayLunar").textContent = "—"; // در صورت نیاز به API
  }

  /* --- انتخابگرها --- */
  function buildSelectors(){
    const ySel = document.getElementById("yearSelect");
    const mSel = document.getElementById("monthSelect");
    const dSel = document.getElementById("daySelect");
    const t = state.today || computeToday();
    for (let y=t[0]-5; y<=t[0]+5; y++){
      const o = document.createElement("option");
      o.value = y; o.textContent = fa(y);
      ySel.appendChild(o);
    }
    FA_MONTHS.forEach((m,i)=>{
      const o = document.createElement("option");
      o.value = i+1; o.textContent = m;
      mSel.appendChild(o);
    });
    function fillDays(){
      const jy = +ySel.value, jm = +mSel.value;
      const total = daysInJMonth(jy,jm);
      dSel.innerHTML = "";
      for (let d=1; d<=total; d++){
        const o = document.createElement("option");
        o.value = d; o.textContent = fa(d);
        dSel.appendChild(o);
      }
    }
    ySel.value = t[0]; mSel.value = t[1]; fillDays(); dSel.value = t[2];
    ySel.addEventListener("change", fillDays);
    mSel.addEventListener("change", fillDays);
    document.getElementById("openDayBtn").addEventListener("click", ()=>{
      selectDay(+ySel.value, +mSel.value, +dSel.value);
      document.getElementById("calendar").scrollIntoView({behavior:"smooth", block:"start"});
    });
  }

  /* --- ناوبری --- */
  function goPrev(){
    if (state.view === "month"){
      state.cursor.jm--; if (state.cursor.jm<1){state.cursor.jm=12; state.cursor.jy--;}
    } else if (state.view === "year"){
      state.cursor.jy--;
    } else {
      const base = state.selected || state.today || computeToday();
      state.selected = addDays(base, -7);
      state.cursor = {jy: state.selected[0], jm: state.selected[1]};
    }
    renderView();
  }
  function goNext(){
    if (state.view === "month"){
      state.cursor.jm++; if (state.cursor.jm>12){state.cursor.jm=1; state.cursor.jy++;}
    } else if (state.view === "year"){
      state.cursor.jy++;
    } else {
      const base = state.selected || state.today || computeToday();
      state.selected = addDays(base, 7);
      state.cursor = {jy: state.selected[0], jm: state.selected[1]};
    }
    renderView();
  }
  function goToday(){
    state.today = computeToday();
    state.cursor = { jy: state.today[0], jm: state.today[1] };
    state.selected = state.today.slice();
    renderTodayHeader();
    renderView();
  }

  /* --- مودال رویداد --- */
  function openModal(){
    const m = document.getElementById("eventModal");
    const d = state.selected || state.today || computeToday();
    document.getElementById("eventDate").value = keyOf(d[0],d[1],d[2]).replace(/\//g,"/");
    document.getElementById("eventTitle").value = "";
    document.getElementById("eventNote").value = "";
    m.hidden = false;
    document.getElementById("eventTitle").focus();
  }
  function closeModal(){ document.getElementById("eventModal").hidden = true; }

  /* --- ذخیره‌سازی سبک --- */
  const STORE_KEY = "bataqvim.events.v1";
  function loadEvents(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) state.events = JSON.parse(raw) || {};
    }catch(e){ state.events = {}; }

    // ادغام رویدادهای سراسری (اگر فایل‌های داده آرایه‌ای export کرده باشند)
    if (Array.isArray(window.EVENTS_1405)) mergeArray(window.EVENTS_1405);
    if (Array.isArray(window.EVENTS_1404)) mergeArray(window.EVENTS_1404);
    if (Array.isArray(window.EVENTS_1406)) mergeArray(window.EVENTS_1406);
  }
  function mergeArray(arr){
    arr.forEach(ev=>{
      if (!ev || !ev.date) return;
      const k = normalizeKey(ev.date);
      (state.events[k] = state.events[k] || []).push({
        title: ev.title || "رویداد",
        type: ev.type || "public",
        time: ev.time || ""
      });
    });
  }
  function normalizeKey(dateStr){
    // پذیرش "۱۴۰۵/۰۷/۱۰" یا "1405/07/10" یا "1405-07-10"
    const digits = String(dateStr).replace(/[۰-۹]/g, ch => "۰۱۲۳۴۵۶۷۸۹".indexOf(ch));
    const m = digits.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (!m) return dateStr;
    return `${+m[1]}/${pad(+m[2])}/${pad(+m[3])}`;
  }
  function saveEvents(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.events)); }catch(e){}
  }

  /* --- راه‌اندازی --- */
  document.addEventListener("DOMContentLoaded", function(){
    renderTodayHeader();
    state.cursor = { jy: state.today[0], jm: state.today[1] };
    state.selected = state.today.slice();
    buildSelectors();
    loadEvents();
    renderView("month");

    document.querySelectorAll(".views .view").forEach(b=>{
      b.addEventListener("click", ()=> renderView(b.dataset.view));
    });
    document.getElementById("prevBtn").addEventListener("click", goPrev);
    document.getElementById("nextBtn").addEventListener("click", goNext);
    document.getElementById("todayBtn").addEventListener("click", goToday);
    document.getElementById("todayBtn2").addEventListener("click", goToday);
    document.getElementById("monthPicker").addEventListener("click", ()=>{
      renderView("year");
    });

    document.getElementById("addTop").addEventListener("click", openModal);
    document.getElementById("addSelectedEvent").addEventListener("click", openModal);
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("eventModal").addEventListener("click", (e)=>{
      if (e.target.id === "eventModal") closeModal();
    });
    document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });

    document.getElementById("eventForm").addEventListener("submit", function(e){
      e.preventDefault();
      const title = document.getElementById("eventTitle").value.trim();
      if (!title) return;
      const dateK = normalizeKey(document.getElementById("eventDate").value);
      const type  = document.getElementById("eventType").value;
      const time  = document.getElementById("eventTime").value;
      const note  = document.getElementById("eventNote").value.trim();
      (state.events[dateK] = state.events[dateK] || []).push({
        title: note ? `${title} — ${note}` : title,
        type, time
      });
      saveEvents();
      closeModal();
      state.selected = dateK.split("/").map(Number);
      state.cursor = { jy: state.selected[0], jm: state.selected[1] };
      renderView();
    });

    // فیلترها (نمایشی)
    document.querySelectorAll(".filter-strip input").forEach(cb=>{
      cb.addEventListener("change", ()=>{
        // در صورت نیاز، اینجا می‌توانید رویدادها را بر اساس نوع فیلتر کنید
      });
    });
  });
})();
</script>
